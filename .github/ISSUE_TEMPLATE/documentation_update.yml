name: "📝 Documentation update"
description: Report missing, unclear, or inaccurate project documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: document
    attributes:
      label: Document or path
      placeholder: "docs/api.md"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is missing or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
  - type: checkboxes
    id: check
    attributes:
      label: Checklist
      options:
        - label: I checked the latest version of the document.
          required: true
        - label: I did not include credentials or private user data.
          required: true

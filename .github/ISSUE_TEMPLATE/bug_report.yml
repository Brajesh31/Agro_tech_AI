name: Bug report
description: Report a reproducible problem in an AgroTech AI service.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Please remove credentials, personal data, private URLs, and production identifiers before submitting. Use the private process in `SECURITY.md` for vulnerabilities.

  - type: checkboxes
    id: existing-issue
    attributes:
      label: Existing issue check
      options:
        - label: I have searched existing issues and could not find a duplicate.
          required: true

  - type: dropdown
    id: service
    attributes:
      label: Affected service
      description: Select the service or area where the problem occurs.
      options:
        - frontend
        - backend
        - agro-quiz-app
        - agrotech-ai-apis
        - api
        - specialist Python API
        - chatbot
        - Docker Compose
        - documentation
        - unknown
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit, branch, or release
      placeholder: main, commit SHA, or release tag
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and include the smallest relevant log or response.
      placeholder: Tell us what you observed.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include commands, endpoint, request shape, and input conditions. Redact secrets and personal data.
      placeholder: |
        1. Start ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js/npm, Python, Docker, browser, and relevant model/runtime versions.
      placeholder: Windows 11, Node 18.x, Python 3.x, Docker Desktop ...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Add only sanitized screenshots or logs that do not contain secrets or private data.

  - type: checkboxes
    id: terms
    attributes:
      label: Submission checklist
      options:
        - label: I have read the Contributing Guidelines.
          required: true
        - label: I have removed secrets and private data from this report.
          required: true

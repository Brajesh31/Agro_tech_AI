name: "🐛 Bug report"
description: Report a reproducible issue in a specific application or service.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, API keys, private user records, farm addresses, or confidential images.
  - type: dropdown
    id: service
    attributes:
      label: Affected service
      options:
        - frontend
        - backend
        - agro-quiz-app
        - agrotech-ai-apis
        - api
        - agrotech-api variant
        - disease / crop API
        - irrigation / soil / seed API
        - chatbot
        - Docker / deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the service...
        2. Send the request...
        3. Observe the issue...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime versions
      placeholder: "Node 20, Python 3.11, Docker version..."
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, passwords, personal records, and local secrets.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I tested against the intended service and environment.
          required: true
        - label: I removed secrets and private data from this report.
          required: true

name: "✨ Feature request"
description: Propose a focused improvement to the platform or one of its services.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Platform area
      options:
        - Frontend / user experience
        - Backend / API
        - Agricultural ML model
        - Database / data
        - Chatbot / AI
        - Deployment / DevOps
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation approach
      description: Explain how the change will be tested. For ML changes, include dataset provenance and evaluation methodology.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked for an existing issue.
          required: true
        - label: This request does not disclose private user data or credentials.
          required: true

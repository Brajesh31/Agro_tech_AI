name: Feature request
description: Propose a focused improvement to AgroTech AI.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Strong proposals describe the user problem and measurable outcome. For model features, include data quality, safety, privacy, and evaluation considerations.

  - type: checkboxes
    id: existing-issue
    attributes:
      label: Existing issue check
      options:
        - label: I have searched existing issues and could not find a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is affected, and what problem or opportunity should the project address?
      placeholder: Farmers, operators, or contributors currently ...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the behavior, interface, endpoint, or workflow you want.
    validations:
      required: true

  - type: textarea
    id: success-criteria
    attributes:
      label: Success criteria
      description: How would we know this feature is useful and complete?
      placeholder: A user can ...; the API returns ...; evaluation reaches ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches or current workarounds.

  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      options:
        - frontend
        - backend
        - AI/ML API
        - chatbot
        - quiz application
        - deployment and operations
        - documentation
        - developer tooling
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - high
        - medium
        - low
    validations:
      required: true

  - type: textarea
    id: safety-data
    attributes:
      label: Safety, privacy, and data considerations
      description: Note personal data, uploaded images, model limitations, consent, external providers, or other risks.

  - type: textarea
    id: supporting-material
    attributes:
      label: Supporting material
      description: Add sanitized screenshots, mockups, examples, research, or links.

  - type: checkboxes
    id: terms
    attributes:
      label: Submission checklist
      options:
        - label: I have read the Contributing Guidelines.
          required: true
        - label: I have removed secrets and private data from this proposal.
          required: true

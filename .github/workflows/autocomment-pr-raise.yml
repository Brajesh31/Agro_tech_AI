name: Comment on new pull request

on:
  pull_request_target:
    types: [opened]

permissions:
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome pull request author
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pullRequest = context.payload.pull_request;
            const contributingUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/${context.payload.repository.default_branch}/CONTRIBUTING.md`;
            const body = [
              `Thank you for submitting pull request #${pullRequest.number}, @${pullRequest.user.login}!`,
              '',
              'A maintainer will review it as soon as possible. Please confirm that the changes are tested and that the pull request checklist is complete.',
              '',
              `See the [contribution guidelines](${contributingUrl}) for review expectations.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              body,
            });

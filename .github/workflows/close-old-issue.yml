name: Manage stale issues

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale issues
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 30
          days-before-close: 14
          stale-issue-message: >-
            This issue has been marked as stale because it has had no activity
            for 30 days. It will be closed in 14 days if no further activity
            occurs.
          close-issue-message: >-
            This issue was closed after remaining inactive for the configured
            stale period. Reopen it or create a focused follow-up issue if it
            remains relevant.
          exempt-issue-labels: "pinned,security"
          stale-issue-label: "stale"
          operations-per-run: 30
          remove-stale-when-updated: true

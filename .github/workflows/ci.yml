name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --runInBand

  quiz:
    name: Quiz application build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agro-quiz-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agro-quiz-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  python-syntax:
    name: Python syntax validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python source files
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import sys

          roots = [
              "api", "agrotech-ai-apis", "agrotech-ai-chatbot",
              "agrotech-api`s", "combined-disease-detection-api",
              "crop-rotation-api", "disease-prediction-api",
              "electrical-electronics-shops-api", "irrigation-api",
              "mushroom-edibility", "paddy-backend-api",
              "seed-qual-predictor", "soil-testing-labs-api",
              "sugarcane-disease-api",
          ]
          failures = []
          for root in roots:
              for path in Path(root).rglob("*.py"):
                  if "__pycache__" in path.parts:
                      continue
                  try:
                      py_compile.compile(str(path), doraise=True)
                  except py_compile.PyCompileError as exc:
                      failures.append(f"{path}: {exc}")
          if failures:
              print("\\n".join(failures))
              sys.exit(1)
          print("Python syntax validation passed.")
          PY

name: Manage stale pull requests

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale pull requests
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-message: >-
            This pull request has been marked as stale because it has had no
            activity for 30 days. It will be closed in 14 days if no further
            activity occurs.
          close-pr-message: >-
            This pull request was closed after remaining inactive for the
            configured stale period. Reopen it or create a focused follow-up
            pull request if it remains relevant.
          exempt-pr-labels: "pinned,security"
          stale-pr-label: "stale"
          operations-per-run: 30
          remove-stale-when-updated: true

name: Comment on new issue

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome issue author
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const contributingUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/${context.payload.repository.default_branch}/CONTRIBUTING.md`;
            const body = [
              `Thank you for opening this issue, @${issue.user.login}!`,
              '',
              'A maintainer will review it as soon as possible. Please add any missing reproduction details, logs, or context in the issue thread.',
              '',
              `Please also review the [contribution guidelines](${contributingUrl}).`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });
